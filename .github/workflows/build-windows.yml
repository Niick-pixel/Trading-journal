name: Build Windows portable

# Produces Signature-portable-<version>.exe — a single file that needs no
# installer, no admin rights, and no Node on the target machine. Run it from
# anywhere; it keeps its journal in a data/ folder beside itself.
#
# This runs on a Windows runner because a Windows executable cannot be built
# reliably from Linux or macOS.

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'brand/**']
  workflow_dispatch:

jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write        # needed to publish the release below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the portable executable
        run: npm run desktop:build
        env:
          # Nothing here is signed; skip electron-builder's signing discovery
          # rather than failing on a missing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Show what was produced
        shell: bash
        run: ls -lh release/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Signature-portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      # Artifacts are buried at the bottom of a run page, expire after 30 days,
      # require a GitHub login, and arrive wrapped in a zip even for one file.
      # Publish the same executable as a release so it is a plain download link
      # on the front of the repository that anyone can click.
      - name: Publish as the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest release/*.exe \
            --title "Signature — latest build" \
            --prerelease \
            --notes "Portable Windows build of Signature. Download the .exe below, put it in a folder of its own, and run it — it keeps its journal in a \`data\` folder beside itself.

          Windows SmartScreen will warn on first launch because the executable is not code-signed. Choose **More info → Run anyway**.

          Built from \`${{ github.sha }}\`."

